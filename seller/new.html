<main class="dash-main" id="main">
<header class="phead"><div><h1>New request for a customer</h1><p>Taking an order in person or on the phone? Log it here and it’s credited to you.</p></div></header>
<form class="card form narrow-form" method="post" action="/dr-reps-web-demo/seller/new">
  <label class="field"><span>What does the customer want?</span><textarea name="want" rows="4" required maxlength="2000" placeholder="One item per line, e.g.&#10;Nike Air Force 1 white, size 42 × 2&#10;Levi's 501, W32 L32"></textarea></label>
  <div class="row2"><label class="field"><span>Customer name</span><input name="name" required maxlength="100"></label>
    <label class="field"><span>Customer WhatsApp / phone</span><input name="phone" type="tel" required maxlength="30"></label></div>
  <div class="row2"><label class="field"><span>Email <small>(optional)</small></span><input name="email" type="email" maxlength="120"></label>
    <label class="field"><span>City <small>(optional)</small></span><input name="city" maxlength="80"></label></div>
  <label class="field"><span>Notes <small>(optional)</small></span><textarea name="notes" rows="2" maxlength="2000" placeholder="Budget, deadline, delivery details"></textarea></label>
  <div class="actions-row"><button class="btn btn-primary btn-lg">Send to the store</button></div>
</form></main>
<div class="toast" data-toast role="status" aria-live="polite" hidden></div>
